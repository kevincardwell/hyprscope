name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - run: |
          v=${GITHUB_REF_NAME#v}
          tar -C target/${{ matrix.target }}/release -czf hyprscope-$v-${{ matrix.target }}.tar.gz hyprscope
          tar -rf /dev/null LICENSE
          tar -czf hyprscope-$v-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release hyprscope -C "$GITHUB_WORKSPACE" LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: hyprscope-*.tar.gz
