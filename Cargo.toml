[package]
name = "hyprscope"
version = "0.1.0"
edition = "2021"
description = "See why every Hyprland window landed where it did, and which rule did it."
authors = ["Kevin Cardwell"]
license = "MIT"
repository = "https://github.com/kevincardwell/hyprscope"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
regex = "1"
mlua = { version = "0.12", features = ["lua55", "vendored"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
